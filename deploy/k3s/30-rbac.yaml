# 플랫폼 네임스페이스 — 클러스터 관리(리소스 브라우저)의 Pod 터미널.
# kube-system 은 여전히 뺀다(허용 목록의 이유 그대로).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-terminal-exec
  namespace: oncloud-ai
  labels:
    app.kubernetes.io/name: pod-terminal-service
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # WebSocket 업그레이드 요청이 GET 이라 create 와 get 둘 다 필요하다.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-terminal-exec
  namespace: oncloud-ai
  labels:
    app.kubernetes.io/name: pod-terminal-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-terminal-exec
subjects:
  - kind: ServiceAccount
    name: pod-terminal-service
    namespace: oncloud-ai
---
# ============================================================================
# 노드 셸 — 호스트에 붙는 터미널 (관리자 전용)
# ============================================================================
# 이 권한은 **노드 root 로 이어진다.** 특권 Pod 를 만들 수 있으면 그 Pod 안에서
# 호스트 네임스페이스로 들어갈 수 있기 때문이다. 그래서 최대한 좁게 준다.
#
#   - 전용 네임스페이스 하나에서만 Pod 를 만들고 지운다(앱 네임스페이스와 분리).
#   - 노드 조회는 ClusterRole 이 불가피하다 — 노드는 네임스페이스가 없는
#     리소스다. 다만 **get/list 만** 주고 수정 권한은 주지 않는다.
#   - 서버도 역할(NODE_SHELL_ROLE_IDS)로 한 번 더 거절한다. RBAC 은 서비스가
#     무엇을 할 수 있는지의 상한이고, 누가 시킬 수 있는지는 서버가 정한다.
apiVersion: v1
kind: Namespace
metadata:
  name: oncloud-ai-node-shell
  labels:
    app.kubernetes.io/name: node-shell
    app.kubernetes.io/managed-by: pod-terminal-service
    # 특권 Pod 를 만드는 곳이라 PodSecurity 를 privileged 로 명시한다.
    # 명시하지 않으면 클러스터 기본값이 restricted 인 환경에서 생성이 거절된다.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-terminal-node-shell
  namespace: oncloud-ai-node-shell
  labels:
    app.kubernetes.io/name: pod-terminal-service
rules:
  # debug Pod 를 만들고, 뜰 때까지 상태를 보고, 끝나면 지운다.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  # 만든 Pod 에 붙는다. Pod 터미널과 같은 이유로 동사가 둘 다 필요하다.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-terminal-node-shell
  namespace: oncloud-ai-node-shell
  labels:
    app.kubernetes.io/name: pod-terminal-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-terminal-node-shell
subjects:
  - kind: ServiceAccount
    name: pod-terminal-service
    namespace: oncloud-ai
---
# 노드는 네임스페이스가 없어 ClusterRole 을 피할 수 없다. 읽기만 준다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-terminal-node-read
  labels:
    app.kubernetes.io/name: pod-terminal-service
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-terminal-node-read
  labels:
    app.kubernetes.io/name: pod-terminal-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-terminal-node-read
subjects:
  - kind: ServiceAccount
    name: pod-terminal-service
    namespace: oncloud-ai
---
# 에이전트 서비스 인스턴스 네임스페이스 — 인스턴스 Pod 는 런타임 + web sidecar 로
# **컨테이너가 여럿**이라 어느 것에 붙을지 고를 수 있어야 한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-terminal-exec
  namespace: oncloud-ai-agent-runtime
  labels:
    app.kubernetes.io/name: pod-terminal-service
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # WebSocket 업그레이드가 GET 이라 create 만으로는 403 이다(다른 ns 규칙과 동일).
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-terminal-exec
  namespace: oncloud-ai-agent-runtime
  labels:
    app.kubernetes.io/name: pod-terminal-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-terminal-exec
subjects:
  - kind: ServiceAccount
    name: pod-terminal-service
    namespace: oncloud-ai
