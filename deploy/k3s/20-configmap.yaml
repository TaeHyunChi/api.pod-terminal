apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-terminal-service-config
  namespace: oncloud-ai-platform
  labels:
    app.kubernetes.io/name: pod-terminal-service
data:
  SERVICE_NAME: pod-terminal-service
  API_PREFIX: /api/v1
  PORT: "8247"
  LOG_LEVEL: INFO
  JSON_LOGS: "true"
  JWT_ALGORITHM: HS256
  AUTH_DISABLED: "false"
  # 터미널은 응답이 끝나지 않는다. 워커당 스레드 수가 곧 동시 접속 수이고,
  # 연결 하나가 컨테이너를 읽는 스레드를 하나 더 쓴다.
  GUNICORN_WORKERS: "1"
  GUNICORN_THREADS: "64"
  # 터미널은 사용자가 치지 않는 동안 아무 것도 흐르지 않는다. 알리지 않으면
  # 프록시(Kong)가 유휴 연결을 끊는다.
  WS_PING_SECONDS: "25"
  # 터미널을 열어도 되는 네임스페이스. exec 는 컨테이너 안에서 임의의 명령을
  # 실행하는 권한이라, 목록이 없으면 로그인한 사람이 kube-system 컨테이너에
  # 셸을 띄울 수 있다. RBAC 도 이 네임스페이스들에만 준다(30-rbac.yaml).
  ALLOWED_NAMESPACES: >-
    oncloud-ai-platform,oncloud-ai-sandbox,oncloud-ai-devops-workspace,oncloud-ai-devops-service,oncloud-ai-model-workspace,oncloud-ai-volume,oncloud-ai-model-serving,oncloud-ai-agent-runtime,oncloud-ai-agent-ecosystem,oncloud-ai-build,oncloud-ai-chroma,oncloud-ai-database,oncloud-ai-gitea,oncloud-ai-harbor,oncloud-ai-kong,oncloud-ai-rabbitmq,oncloud-ai-workflow-ecosystem
  # 볼륨 권한 설정(관리자 메뉴)에서 '터미널' 권한을 켠 네임스페이스를 위 목록에 더한다(app/granted.py).
  VOLUME_SERVICE_URL: http://volume-service.oncloud-ai-platform.svc.cluster.local:8215/api/v1
  # 다른 클러스터(클러스터 관리에 추가된 것) — kubeconfig 를 k8s-cluster-service 의 서비스 전용 경로로 받아 붙는다.
  # 이 플랫폼 클러스터가 노드 주소로 등록돼 있으면 ServiceAccount 로 붙는다(허용 목록 그대로).
  K8S_CLUSTER_SERVICE_URL: http://k8s-cluster-service.oncloud-ai-platform.svc.cluster.local:8209/api/v1
  LOCAL_API_SERVER_URLS: https://192.168.201.50:6443
  REMOTE_CLUSTER_PERMISSIONS: k8s-cluster.resource.manage,k8s-cluster.cluster.manage
  # 노드 셸(호스트 터미널) — 노드 root 권한이라 관리자 역할만 열 수 있다.
  # 비워 두면 아무도 열 수 없다.
  NODE_SHELL_NAMESPACE: oncloud-ai-node-shell
  NODE_SHELL_ROLE_IDS: seed-admin
  NODE_SHELL_IMAGE: oncloud-ai.co.kr:5000/system/busybox:1.36
  # --- 분산 트레이스 (LGTM: OTLP → Alloy → Tempo, app/otel.py) — 비우면 계측하지 않는다 ---
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.oncloud-ai-monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
