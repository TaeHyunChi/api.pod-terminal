# Pod 원격 터미널 서비스.
#
# 브라우저 WebSocket 을 k8s exec 로 중계한다. DB 를 쓰지 않아 마이그레이션 Job 이
# 없다 — 상태는 열려 있는 연결이 전부다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-terminal-service
  namespace: oncloud-ai
  labels:
    app.kubernetes.io/name: pod-terminal-service
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      # 워커가 1대라 maxSurge 를 두면 새 Pod 이 뜰 자리가 없다.
      # 교체 중 WebSocket 이 끊기지만 화면이 다시 붙는다.
      maxUnavailable: 1
      maxSurge: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-terminal-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-terminal-service
        app.kubernetes.io/component: api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # 컨테이너에 셸을 띄우려면 이 SA 의 토큰이 필요하다(30-rbac.yaml).
      serviceAccountName: pod-terminal-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: pod-terminal-service
          image: oncloud-ai.co.kr:5000/oncloud-ai/pod-terminal-service:0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8247
          envFrom:
            - configMapRef:
                name: pod-terminal-service-config
          env:
            - name: JWT_SECRET
              valueFrom:
                # 클러스터 공용 Secret. 모든 MSA 서비스가 같은 토큰을 검증한다.
                secretKeyRef: { name: oncloud-ai-jwt, key: jwt-secret }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
