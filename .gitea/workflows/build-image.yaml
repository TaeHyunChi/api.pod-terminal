# MSA 이미지 빌드 — main 에 push 되면 x86_64 이미지를 만들어 내부 레지스트리에 올린다.
#
# 이전 전에는 맥에서 `docker build` + `skopeo copy` 를 손으로 돌렸다. 운영 클러스터가
# x86_64 라 맥(arm64)에서 빌드하면 에뮬레이션이 걸려 현실적이지 않다. 빌드를 클러스터
# 안으로 옮겼다 — 24코어라 오히려 빠르다.
#
# Kaniko 를 `docker run -v "$PWD":/workspace` 로 돌리는 방법은 **동작하지 않는다**.
# 잡이 컨테이너 안에서 실행되므로 그 경로는 dind 데몬의 파일시스템에 없고,
# Kaniko 가 빈 디렉터리를 컨텍스트로 받아 "dockerfile path" 오류로 죽는다(실제로 겪었다).
# dind 의 `docker build` 는 컨텍스트를 API 로 전송하므로 이 문제가 없다.
#
# 레지스트리는 평문 HTTP 다. 러너의 dind 사이드카가
# `--insecure-registry=oncloud-ai.co.kr:5000` 로 떠 있어 이 주소로만 push 가 된다.
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 확인
        id: meta
        run: |
          # 배포 매니페스트가 정본이다. 태그를 워크플로에 중복 정의하지 않는다 —
          # 두 곳에 두면 반드시 어긋난다.
          IMAGE=$(grep -h -m1 'image: oncloud-ai.co.kr:5000/platform/' deploy/k3s/40-deployment.yaml | sed 's|.*image: ||' | tr -d ' ')
          if [ -z "$IMAGE" ]; then
            echo "deploy/k3s/40-deployment.yaml 에서 이미지 주소를 찾지 못했습니다." >&2
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: $IMAGE"

      - name: 빌드 + push
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -e
          IMAGE="${{ steps.meta.outputs.image }}"
          # 이미지 이름(oncloud-ai.co.kr:5000/...)은 매니페스트의 것을 그대로 쓰고
          # **push 만 Harbor 주소**로 한다. 레지스트리에 남는 repository 경로가 같아서
          # pull 은 노드 미러가 그대로 처리한다 — 매니페스트를 고칠 필요가 없다.
          #
          # 이름 해석과 TLS 는 **dind 데몬** 몫이다. `docker push` 를 실행하는 것은 잡
          # 컨테이너지만 실제로 레지스트리에 붙는 쪽은 데몬이고, 러너 파드의
          # hostAliases 와 /etc/docker/certs.d/ 의 사설 CA 가 거기에 걸려 있다.
          PUSH_ADDR="harbor.oncloud-ai.co.kr"
          PUSH_IMAGE="$PUSH_ADDR/${IMAGE#*/}"
          # Harbor 는 push 에 인증을 요구한다(pull 은 public project 라 익명 허용).
          # 자격은 관리자가 아니라 push 권한만 가진 로봇 계정이다.
          echo "$HARBOR_PASSWORD" | docker login "$PUSH_ADDR" -u "$HARBOR_USER" --password-stdin
          docker build -f Dockerfile -t "$IMAGE" -t "$PUSH_IMAGE" .
          docker push "$PUSH_IMAGE"
          docker logout "$PUSH_ADDR" >/dev/null 2>&1 || true
          echo "push 완료: $PUSH_IMAGE (매니페스트 참조명: $IMAGE)"
