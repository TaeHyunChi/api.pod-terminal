# MSA 이미지 빌드 — main 에 push 되면 x86_64 이미지를 만들어 내부 레지스트리에 올린다.
#
# 이전 전에는 맥에서 `docker build` + `skopeo copy` 를 손으로 돌렸다. 운영 클러스터가
# x86_64 라 맥(arm64)에서 빌드하면 에뮬레이션이 걸려 현실적이지 않다. 빌드를 클러스터
# 안으로 옮겼다 — 24코어라 오히려 빠르다.
#
# Kaniko 를 `docker run -v "$PWD":/workspace` 로 돌리는 방법은 **동작하지 않는다**.
# 잡이 컨테이너 안에서 실행되므로 그 경로는 dind 데몬의 파일시스템에 없고,
# Kaniko 가 빈 디렉터리를 컨텍스트로 받아 "dockerfile path" 오류로 죽는다(실제로 겪었다).
# dind 의 `docker build` 는 컨텍스트를 API 로 전송하므로 이 문제가 없다.
#
# 레지스트리는 평문 HTTP 다. 러너의 dind 사이드카가
# `--insecure-registry=oncloud-ai.co.kr:5000` 로 떠 있어 이 주소로만 push 가 된다.
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 확인
        id: meta
        run: |
          # 배포 매니페스트가 정본이다. 태그를 워크플로에 중복 정의하지 않는다 —
          # 두 곳에 두면 반드시 어긋난다.
          IMAGE=$(grep -h -m1 'image: oncloud-ai.co.kr:5000/platform/' deploy/k3s/40-deployment.yaml | sed 's|.*image: ||' | tr -d ' ')
          if [ -z "$IMAGE" ]; then
            echo "deploy/k3s/40-deployment.yaml 에서 이미지 주소를 찾지 못했습니다." >&2
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: $IMAGE"

      - name: 빌드 + push
        run: |
          set -e
          IMAGE="${{ steps.meta.outputs.image }}"
          # 매니페스트의 이미지 이름(oncloud-ai.co.kr:5000/...)으로 빌드하되, push 는
          # **노드 주소**로 한다. 잡 컨테이너 안에서 그 도메인은 공인 IP 로 해석되어
          # 레지스트리에 닿지 못한다(빌드는 되고 push 에서 타임아웃 — 실제로 겪었다).
          # 러너 파드의 hostAliases 는 dind 가 띄우는 잡 컨테이너에 상속되지 않는다.
          # 레지스트리에 남는 repository 경로가 같아서 pull 은 미러로 그대로 동작한다.
          PUSH_ADDR="192.168.201.50:30500"
          PUSH_IMAGE="$PUSH_ADDR/${IMAGE#*/}"
          docker build -f Dockerfile -t "$IMAGE" -t "$PUSH_IMAGE" .
          docker push "$PUSH_IMAGE"
          echo "push 완료: $PUSH_IMAGE (매니페스트 참조명: $IMAGE)"
